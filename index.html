<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Family Vault</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div id="login-card" class="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-gray-700">
        <h1 class="text-3xl font-bold mb-2 text-blue-400">Family Vault</h1>
        <p class="text-gray-400 mb-6 text-sm">Enter the secret password to decrypt family memories.</p>
        
        <input type="password" id="password-input" placeholder="Password" class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">
        
        <button onclick="unlockVault()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold p-3 rounded-lg transition duration-200 cursor-pointer">Unlock</button>
        
        <p id="error-msg" class="text-red-400 mt-3 text-sm hidden">Incorrect password. Access denied.</p>
    </div>

    <div id="vault-content" class="w-full max-w-5xl hidden">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold text-blue-400">Our Shared Memories</h1>
            <button onclick="logout()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm transition cursor-pointer">Lock Vault</button>
        </header>

        <div id="media-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <script>
        // ==========================================
        // YOUR MEDIA STORAGE
        // Replace these placeholder links with your actual private image/video URLs
        // ==========================================
        const familyMedia = [
            { type: 'image', url: 'https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=1000', caption: 'Family Dinner' },
            { type: 'video', url: 'https://www.w3schools.com/html/mov_bbb.mp4', caption: 'Summer Vacation Video' }
        ];

        function unlockVault() {
            const password = document.getElementById('password-input').value.trim();
            
            // Your exact master password
            if (password === "Jamescheeta92435617610802") {
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('vault-content').classList.remove('hidden');
                displayMedia();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        function displayMedia() {
            const grid = document.getElementById('media-grid');
            grid.innerHTML = '';

            familyMedia.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-700";

                let mediaHtml = '';
                if (item.type === 'image') {
                    mediaHtml = `<img src="${item.url}" class="w-full h-56 object-cover" alt="Family photo">`;
                } else if (item.type === 'video') {
                    mediaHtml = `<video src="${item.url}" controls class="w-full h-56 object-cover"></video>`;
                }

                card.innerHTML = `${mediaHtml}<div class="p-4"><p class="text-sm text-gray-300 font-medium">${item.caption}</p></div>`;
                grid.appendChild(card);
            });
        }

        function logout() {
            document.getElementById('password-input').value = '';
            document.getElementById('login-card').classList.remove('hidden');
            document.getElementById('vault-content').classList.add('hidden');
            document.getElementById('error-msg').classList.add('hidden');
        }
    </script>
</body>
</html>
